<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Content Workflow Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>AI Content Workflow Dashboard</h1>
      <p>Single-user monitoring, analytics, and controls</p>
    </div>
    <div class="topbar-actions">
      <button id="refreshBtn" type="button">Refresh</button>
      <label class="inline-toggle">
        <input id="autoRefresh" type="checkbox" checked />
        Auto-refresh (15s)
      </label>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>System Summary</h2>
      <div class="cards" id="summaryCards"></div>
      <div id="statusBars" class="status-bars"></div>
    </section>

    <section class="panel">
      <h2>Daily Trend (14 days)</h2>
      <div id="dailyTrend" class="daily-trend"></div>
    </section>

    <section class="panel">
      <h2>Controls</h2>
      <form id="triggerForm" class="form-grid">
        <label>
          Discovery Mode
          <select id="discoveryMode" name="discovery_mode">
            <option value="manual">manual</option>
            <option value="api">api</option>
          </select>
        </label>
        <label>
          Topic (manual)
          <input id="topicInput" name="topic" placeholder="OAuth 2.0 vs OIDC vs SSO" />
        </label>
        <label>
          Discovery Query (api)
          <input id="queryInput" name="discovery_query" placeholder="identity management trends" />
        </label>
        <label>
          Control Token (optional)
          <input id="tokenInput" name="control_token" placeholder="DASHBOARD_CONTROL_TOKEN" />
        </label>
      </form>
      <div class="control-actions">
        <button id="triggerBtn" type="button">Trigger New Run</button>
        <button id="retryBtn" type="button">Retry Last Failed</button>
      </div>
      <pre id="controlResult" class="logbox">No control action yet.</pre>
    </section>

    <section class="panel">
      <h2>Recent Runs</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Updated</th>
              <th>Status</th>
              <th>Topic</th>
              <th>Score</th>
              <th>Dev.to</th>
              <th>Medium</th>
              <th>Run ID</th>
            </tr>
          </thead>
          <tbody id="runsTbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
